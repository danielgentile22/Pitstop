name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Seed and iOS tests (scripts/check.sh)
    # Hosted runners lag the local Xcode, so watch this run after every iOS push.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: astral-sh/setup-uv@v6

      - run: scripts/check.sh

      - name: Upload the build and test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            build/check-build.log
            build/check-test.log
          if-no-files-found: ignore
